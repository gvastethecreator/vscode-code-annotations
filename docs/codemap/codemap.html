<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code map · vscode-code-annotations</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #050505;
      --paper-2: #101010;
      --pattern: rgba(255, 255, 255, .012);
      --node-paper: #141414;
      --ink: #f5f5f5;
      --muted: #b0b0b0;
      --soft: #8a8a8a;
      --chrome-line: rgba(255, 255, 255, .02);
      --chrome-radius: 12px;
      --rule: rgba(255, 255, 255, .12);
      --rule-solid: #3a3a3a;
      --grid: rgba(255, 255, 255, .035);
      --wash-2: rgba(255, 255, 255, .03);
      --wash-3: rgba(255, 255, 255, .04);
      --wash-6: rgba(255, 255, 255, .07);
      --wash-10: rgba(255, 255, 255, .1);
      --wash-30: rgba(255, 255, 255, .28);
      --accent: #ffffff;
      --accent-tint: rgba(255, 255, 255, .08);
      --link: #4da3ff;
      --connector: #6e6e6e;
      --connector-dim: #2a2a2a;
      --edge-imports: #3d8fff;
      --edge-calls: #c45cff;
      --edge-reads: #3ec2ff;
      --edge-writes: #ffc107;
      --edge-publishes: #ff6a2a;
      --edge-subscribes: #ff3d8a;
      --edge-unknown: #ff3b3b;
      --card-shadow: transparent;
      --boundary-saturation: 64%;
      --boundary-lightness: 47%;
      --sans: "Segoe UI", system-ui, sans-serif;
      --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
      --ease-out: cubic-bezier(.23, 1, .32, 1);
      --ease-in: cubic-bezier(.4, 0, 1, 1);
      --ease-in-out: cubic-bezier(.45, 0, .15, 1);
      --motion-quick: 140ms;
      --motion-panel: 220ms;
      --motion-camera: 280ms;
      --edge-registers: #a5a0ff;
    }

    .skip {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 20;
      padding: 6px 10px;
      background: var(--paper-2);
      color: var(--ink);
      border: 1px solid var(--rule-solid);
      transform: translateY(-120%);
    }
    .skip:focus { transform: none; }
    * { box-sizing: border-box; }
    * { scrollbar-color: var(--rule-solid) var(--paper-2); scrollbar-width: thin; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: var(--paper-2); }
    *::-webkit-scrollbar-thumb {
      border: 2px solid var(--paper-2);
      background: var(--rule-solid);
    }
    *::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font: 12px/1.45 var(--sans);
    }
    button, input { font: inherit; color: inherit; }
    .eyebrow {
      margin: 0;
      color: var(--soft);
      font: 10px/1.2 var(--mono);
      letter-spacing: .04em;
      text-transform: none;
    }
    header, .eyebrow, .head-right, .meta { display: none; }
    .map-head {
      position: absolute;
      z-index: 5;
      top: 8px;
      left: 8px;
      max-width: min(360px, calc(100% - 280px));
      padding: 10px 12px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      background: color-mix(in srgb, var(--paper) 88%, transparent);
    }
    .map-head h1 { margin: 0; font: 600 16px/1.2 var(--mono); overflow-wrap: anywhere; }
    .map-head .map-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 4px 0 0; color: var(--soft); font: 12px/1.3 var(--mono); }
    .map-head .map-time { display: none; }
    .card-legend {
      position: absolute;
      z-index: 5;
      left: 8px;
      bottom: 36px;
      min-width: 148px;
      max-width: 240px;
      max-height: 42vh;
      overflow: auto;
      padding: 10px 12px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      background: color-mix(in srgb, var(--paper) 88%, transparent);
    }
    .card-legend .legend-title { margin: 0 0 8px; color: var(--soft); font: 12px/1.2 var(--mono); }
    .card-legend .boundary-chip {
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 4px;
      background: var(--group-color);
    }
    .left .section:has(#boundary-legend) { display: none; }

    main {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      position: relative;
    }
    aside {
      position: absolute;
      z-index: 9;
      top: 108px;
      bottom: 60px;
      min-width: 0;
      overflow: auto;
      background: var(--paper-2);
      border: 2px solid var(--chrome-line);
      border-radius: 16px;
      transition: opacity var(--motion-panel) var(--ease-out), transform var(--motion-panel) var(--ease-out), visibility var(--motion-panel);
    }
    main[data-left-collapsed="true"] .left,
    main[data-right-collapsed="true"] .right {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .left { left: 12px; width: 236px; padding: 18px; }
    .right { right: 12px; width: 320px; padding: 20px; user-select: text; }
    main[data-left-collapsed="true"] .left { transform: translateX(-12px); }
    main[data-right-collapsed="true"] .right { transform: translateX(12px); }
    .section { margin-bottom: 14px; }
    .section-title { margin: 0 0 6px; color: var(--soft); font: 10px/1.3 var(--mono); letter-spacing: 0; text-transform: none; }
    input[type="search"] {
      width: 100%;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--rule-solid);
      border-radius: 0;
      outline: none;
      background: var(--paper);
      font-family: var(--mono);
    }
    input[type="search"]:focus { border-color: var(--ink); }
    .filter, .legend-row { display: flex; align-items: center; gap: 8px; min-height: 26px; }
    .filter { cursor: pointer; }
    .filter input { accent-color: var(--ink); width: 13px; height: 13px; margin: 0; }
    .filter code, .legend-row code { font: 12px/1 var(--mono); letter-spacing: 0; color: var(--soft); }
    .type-key { width: 72px; flex: 0 0 auto; color: var(--muted); font: 12px/1 var(--mono); letter-spacing: 0; }
    .boundary-chip { width: 12px; height: 12px; flex: 0 0 auto; border: 1px solid var(--group-color); background: color-mix(in srgb, var(--group-color) 18%, var(--paper)); }
    .edge-key { position: relative; width: 20px; height: 8px; flex: 0 0 auto; color: var(--edge-color); }
    .edge-key::before { content: ""; position: absolute; top: 3px; left: 0; width: 15px; border-top: 2px solid currentColor; }
    .edge-key::after { content: ""; position: absolute; top: 1px; right: 0; border-top: 3px solid transparent; border-bottom: 3px solid transparent; border-left: 5px solid currentColor; }
    .rule-chip { width: 16px; height: 0; flex: 0 0 auto; border-top: 2px solid var(--connector); }
    .rule-chip[data-state="selected"] { border-top-color: var(--accent); }
    .rule-chip[data-state="callers"] { border-top-color: var(--link); }
    .rule-chip[data-state="dependencies"] { border-top-color: var(--ink); }
    .rule-chip[data-state="flow"] { border-top-color: var(--accent); }
    .rule-chip[data-state="unknown"] { border-top-style: dashed; border-top-color: var(--edge-unknown); }
    .flow-button {
      width: 100%;
      margin: 0 0 6px;
      padding: 7px 8px;
      border: 1px solid var(--rule-solid);
      border-radius: 0;
      background: var(--paper);
      text-align: left;
      cursor: pointer;
    }
    .flow-button { transition: border-color 140ms ease-out, background-color 140ms ease-out, color 140ms ease-out; }
    .flow-button:hover, .flow-button:focus-visible { border-color: var(--ink); outline: none; }
    .flow-button.active { border-color: var(--ink); background: var(--accent-tint); }
    .flow-button.related { border-color: var(--link); }
    .flow-button small { display: block; margin-top: 4px; color: var(--muted); font: 10px/1.4 var(--mono); }

    .map-shell {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--pattern) 1px, transparent 1px),
        linear-gradient(90deg, var(--pattern) 1px, transparent 1px);
      background-size: 16px 16px;
      -webkit-user-select: none;
      user-select: none;
    }
    .toolbar {
      position: absolute;
      z-index: 4;
      top: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      background: color-mix(in srgb, var(--paper) 92%, transparent);
    }
    .toolbar input[type="search"] {
      width: 176px;
      height: 28px;
      margin: 0;
      padding: 0 10px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      outline: none;
      background: var(--paper);
      font: 13px/1 var(--mono);
    }
    .toolbar input[type="search"]:focus { border-color: var(--ink); }
    .toolbar button {
      min-width: 30px;
      height: 28px;
      padding-inline: 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font: 12px/1 var(--mono);
      letter-spacing: 0;
      text-transform: none;
      transition: border-color 140ms ease-out, color 140ms ease-out, background-color 140ms ease-out, opacity 140ms ease-out;
    }
    .toolbar button:hover, .toolbar button:focus-visible { border-color: var(--ink); color: var(--ink); outline: 1px solid var(--ink); outline-offset: 1px; }
    .toolbar button[aria-expanded="false"] { color: var(--soft); background: var(--wash-6); }
    .toolbar button:disabled { cursor: not-allowed; opacity: .38; }
    .toolbar-separator { width: 1px; margin: 4px 2px; background: var(--rule); }
    #map-svg { width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
    .map-bg { fill: transparent; }

    #arrow-muted path { fill: var(--connector); }
    #arrow-ink path { fill: var(--ink); }
    #arrow-link path { fill: var(--link); }
    #arrow-accent path { fill: var(--accent); }
    #arrow-soft path { fill: var(--connector-dim); }
    #arrow-imports path { fill: var(--edge-imports); }
    #arrow-calls path { fill: var(--edge-calls); }
    #arrow-reads path { fill: var(--edge-reads); }
    #arrow-writes path { fill: var(--edge-writes); }
    #arrow-publishes path { fill: var(--edge-publishes); }
    #arrow-subscribes path { fill: var(--edge-subscribes); }
    #arrow-unknown path { fill: var(--edge-unknown); }

    .zone, .zone-mask, .zone-label { display: none; }

    [data-edge-type="imports"] { --edge-color: var(--edge-imports); }
    [data-edge-type="calls"] { --edge-color: var(--edge-calls); }
    [data-edge-type="reads"] { --edge-color: var(--edge-reads); }
    [data-edge-type="writes"] { --edge-color: var(--edge-writes); }
    [data-edge-type="publishes"] { --edge-color: var(--edge-publishes); }
    [data-edge-type="subscribes"] { --edge-color: var(--edge-subscribes); }
    .edge {
      fill: none;
      stroke: var(--edge-paint, var(--edge-color, var(--connector)));
      stroke-width: 1.75;
      marker-end: url(#arrow-muted);
      pointer-events: stroke;
      cursor: crosshair;
      transition: stroke-width 180ms var(--ease-in), opacity 180ms var(--ease-in);
    }
    .edge-blend-from,
    .edge-blend-to {
      stop-color: var(--edge-color, var(--connector));
      transition: stop-color 180ms var(--ease-in);
    }
    .edge-blend-mid {
      stop-color: var(--edge-color, var(--connector));
    }
    .edge-bundle.blend .edge-blend-from {
      stop-color: var(--from-card);
      transition: stop-color 240ms var(--ease-out);
    }
    .edge-bundle.blend .edge-blend-to {
      stop-color: var(--to-card);
      transition: stop-color 240ms var(--ease-out);
    }
    .edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 48;
      vector-effect: non-scaling-stroke;
      pointer-events: stroke;
      cursor: crosshair;
    }
    .edge-march {
      fill: none;
      stroke: color-mix(in srgb, var(--edge-color, var(--connector)) 55%, #ffffff);
      stroke-width: 3.25;
      stroke-dasharray: 11 9;
      stroke-linecap: round;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms var(--ease-in);
    }
    .edge-march.on,
    .edge-hit:hover + .edge + .edge-march {
      opacity: 1;
      transition: opacity 240ms var(--ease-out);
      animation: edge-flow 640ms linear infinite;
    }
    @keyframes edge-flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -20; }
    }
    .edge[data-edge-type="imports"] { marker-end: url(#arrow-imports); }
    .edge[data-edge-type="calls"] { marker-end: url(#arrow-calls); }
    .edge[data-edge-type="reads"] { marker-end: url(#arrow-reads); }
    .edge[data-edge-type="writes"] { marker-end: url(#arrow-writes); }
    .edge[data-edge-type="publishes"] { marker-end: url(#arrow-publishes); }
    .edge[data-edge-type="subscribes"] { marker-end: url(#arrow-subscribes); }
    .edge.unknown { --edge-color: var(--edge-unknown); stroke-width: 1.75; stroke-dasharray: 5 4; marker-end: url(#arrow-unknown); }
    .edge.hot {
      stroke-width: 2.75;
      opacity: 1;
      transition: stroke-width 240ms var(--ease-out), opacity 240ms var(--ease-out);
    }
    .edge.flow {
      --edge-color: var(--accent);
      stroke-width: 2.75;
      marker-end: url(#arrow-accent);
      transition: stroke-width 240ms var(--ease-out), opacity 240ms var(--ease-out);
    }
    .edge.dim { stroke-width: 1.25; opacity: .12; }
    .edge-mask { fill: var(--paper); pointer-events: none; }
    .edge-label { fill: var(--edge-color, var(--connector)); font: 600 11px var(--mono); letter-spacing: 0; pointer-events: none; }

    @media (hover: hover) and (pointer: fine) {
      .edge:hover, .edge-hit:hover + .edge {
        stroke-width: 3;
        opacity: 1;
      }
    }

    .node {
      cursor: grab;
      outline: none;
      --fill: var(--group-color);
      transition: opacity 140ms ease-out;
    }
    .node:active { cursor: grabbing; }
    .node.hot, .node.flow, .node.match { opacity: 1; }
    .node.focus { opacity: 1; }
    .node .card-visual { transform-box: fill-box; transform-origin: center; }
    .node .card-shadow, .node .card-head, .node .card-rule, .node .group-rail, .node .tag { display: none; }
    .node .box { fill: var(--fill); stroke: none; }
    .node .card-lip { fill: url(#card-lip); pointer-events: none; }
    .node .card-scrim { pointer-events: none; }
    .node .wash-a,
    .node .wash-b,
    .node .wash-c {
      transition: stop-color 180ms var(--ease-out), stop-opacity 180ms var(--ease-out);
    }
    .node .wash-a {
      stop-color: color-mix(in srgb, var(--group-color) 58%, #111111);
      stop-opacity: .16;
    }
    .node .wash-b {
      stop-color: color-mix(in srgb, var(--group-color) 36%, #0a0a0a);
      stop-opacity: .4;
    }
    .node .wash-c {
      stop-color: color-mix(in srgb, var(--group-color) 20%, #050505);
      stop-opacity: .76;
    }
    .node.focus .wash-a {
      stop-color: color-mix(in srgb, var(--group-color) 20%, #050505);
      stop-opacity: .76;
    }
    .node.focus .wash-c {
      stop-color: color-mix(in srgb, var(--group-color) 58%, #111111);
      stop-opacity: .16;
    }
    .node .tag-text { fill: rgba(255, 255, 255, .86); font: 600 11px var(--mono); letter-spacing: .06em; }
    .node .boundary-stamp,
    .node .node-title,
    .node .node-path { dominant-baseline: hanging; }
    .node .boundary-stamp { fill: rgba(255, 255, 255, .82); font: 13px/1.15 var(--sans); letter-spacing: 0; }
    .node .node-title { fill: #ffffff; font: 600 20px/1.15 var(--sans); letter-spacing: 0; }
    .node .node-path { fill: rgba(255, 255, 255, .88); font: 15px/1.2 var(--sans); }
    .node.dim { opacity: .14; }

    .empty { color: var(--muted); }
    .detail-title { margin: 0 0 2px; font: 600 16px/1.25 var(--mono); letter-spacing: 0; overflow-wrap: anywhere; }
    .detail-path { margin: 0 0 12px; color: var(--muted); font: 11px/1.4 var(--mono); overflow-wrap: anywhere; }
    .detail-block { margin: 0 0 12px; }
    .detail-block h3 { margin: 0 0 4px; color: var(--soft); font: 10px var(--mono); letter-spacing: 0; text-transform: none; }
    .detail-block p { margin: 0; overflow-wrap: anywhere; }
    .detail-block ul { margin: 0; padding-left: 16px; }
    .detail-block li { overflow-wrap: anywhere; }
    .detail-block code, .detail-block li { font-family: var(--mono); }
    .detail-boundary { color: var(--group-color); }
    .test-list { padding: 8px; border: 1px solid var(--rule-solid); background: var(--paper); }
    .detail-action {
      width: 100%;
      min-height: 32px;
      margin: 0 0 12px;
      border: 1px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      background: var(--accent-tint);
      cursor: pointer;
      font: 600 11px var(--mono);
      letter-spacing: 0;
      text-transform: none;
      transition: background-color 140ms ease-out;
    }
    .detail-action:hover, .detail-action:focus-visible { background: var(--paper); outline: 1px solid var(--ink); outline-offset: 1px; }
    .badge {
      display: inline-block;
      margin-top: 4px;
      padding: 0 4px;
      border: 1px solid var(--rule-solid);
      color: var(--soft);
      font: 10px/16px var(--mono);
      letter-spacing: 0;
      text-transform: none;
    }
    .status-line {
      position: absolute;
      right: 8px;
      left: auto;
      bottom: 8px;
      max-width: min(420px, calc(100% - 16px));
      padding: 6px 10px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      color: var(--ink);
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      font: 12px/1.4 var(--mono);
      letter-spacing: 0;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      main { --left-column: 200px; grid-template-columns: var(--left-column) minmax(0, 1fr); }
      .right { display: none; }
      .right:not(:has(> .empty)) {
        display: block;
        position: fixed;
        z-index: 8;
        top: 8px;
        right: 8px;
        bottom: 8px;
        width: min(280px, calc(100vw - 216px));
        border: 1px solid var(--rule-solid);
      }
      .map-head { max-width: min(240px, calc(100% - 200px)); }
    }
    @media (max-width: 600px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      main {
        height: auto;
        min-height: 100vh;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 100vh auto;
      }
      .map-shell { grid-row: 1; min-height: 520px; }
      .left { grid-row: 2; border-top: 1px solid var(--rule); border-right: 0; }
      .right:not(:has(> .empty)) { top: auto; left: 8px; width: auto; max-height: 65vh; }
      main[data-left-collapsed="true"] .left,
      main[data-right-collapsed="true"] .right {
        padding-inline: 12px;
        border-color: var(--rule);
        opacity: 1;
        overflow: auto;
        visibility: visible;
        pointer-events: auto;
      }
      #toggle-left, #toggle-right { display: none; }
      .toolbar-separator { display: none; }
      .toolbar { right: 8px; max-width: calc(100% - 16px); }
      .map-head { max-width: calc(100% - 16px); }
      .card-legend { max-width: calc(100% - 16px); }
    }

    .explore-bar { position: absolute; z-index: 6; top: 76px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none; }
    .breadcrumbs, .view-actions, .pagination { display: flex; gap: 4px; align-items: center; pointer-events: auto; border: 2px solid var(--chrome-line); background: var(--paper-2); border-radius: 12px; padding: 4px; }
    .breadcrumbs { max-width: 60%; overflow: auto; scrollbar-width: none; }
    .breadcrumbs button, .view-actions button, .pagination button { border: 0; background: transparent; border-radius: 8px; padding: 7px 10px; white-space: nowrap; cursor: pointer; color: var(--muted); }
    .breadcrumbs button:last-child { color: var(--ink); background: var(--wash-6); }
    .breadcrumbs span { color: var(--soft); }
    button { transition: transform var(--motion-quick) var(--ease-out), background-color var(--motion-quick), color var(--motion-quick); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:focus-visible, .node:focus-visible { outline: 2px solid #c6d9ff; outline-offset: 3px; }
    .view-actions button[aria-pressed="true"] { background: #24304b; color: #c6d9ff; }
    .view-actions button:hover, .breadcrumbs button:hover, .pagination button:hover { background: var(--wash-6); color: var(--ink); }
    .pagination { position: absolute; z-index: 6; bottom: 38px; left: 50%; transform: translateX(-50%); }
    .pagination span { padding: 0 10px; color: var(--muted); font: 11px var(--mono); }
    .pagination button:disabled { opacity: .25; cursor: default; }
    .coverage-pill { font: 11px var(--mono); }
    .coverage-pill[data-quality="partial"] { color: #f6c986; }
    .map-head { top: 14px; left: 14px; background: var(--paper); }
    .map-head h1 { font-family: var(--sans); font-size: 19px; letter-spacing: -.025em; }
    .toolbar { top: 17px; right: 16px; }
    .card-legend { left: 16px; bottom: 42px; max-height: 28vh; }
    .empty-view { position: absolute; inset: 40% 20% auto; text-align: center; pointer-events: none; color: var(--muted); }
    .empty-view h2 { font-size: 22px; letter-spacing: -.025em; color: var(--ink); }

      const viewport = document.getElementById("viewport");

      const GRID = 4;
      const NODE_W = 360;
      const NODE_H = 132;
      const GAP = 96;
      const COL_PITCH = NODE_W + GAP;
      const ROW_PITCH = NODE_H + GAP;
      const ORIGIN_X = 48;
      const ORIGIN_Y = 64;
      const RADIUS = 10;
      const CARD_RADIUS_TL = 22;
      const CARD_RADIUS_TR = 6;
      const CARD_RADIUS_BR = 22;
      const CARD_RADIUS_BL = 6;
      const PAD_X = 24;
      const PAD_Y = 16;
      const TITLE_SIZE = 20;
      const PATH_SIZE = 15;
      const STAMP_SIZE = 13;
      const COPY_GAP = 8;
      const STAMP_Y = PAD_Y;
      const TITLE_Y = STAMP_Y + Math.round(STAMP_SIZE * 1.2) + COPY_GAP;
      const PATH_Y = TITLE_Y + Math.round(TITLE_SIZE * 1.15) + COPY_GAP;
      const LANE_STEP = 12;
      const LANE_GUTTER = 24;
      const LANE_COUNT = Math.max(2, Math.floor((GAP - LANE_GUTTER) / LANE_STEP) - 1);
      const LANE_CLEARANCE = 20;
      const PORT_MIN = 12;
      const SIDE_PORT_MAX = 4;
      const ZONE_TOP = 32;
      const ZONE_BOTTOM = 16;
      const ZONE_SIDE = 24;
      const HOP = 8;
      const LABEL_GAP = 8;
      const LABEL_H = 14;
      const LABEL_CHAR = 7;
      const LABEL_BUDGET = 14;
      const TAGS = { module: "MODULE", service: "SERVICE", database: "DATABASE", queue: "QUEUE", interface: "INTERFACE", external: "EXTERNAL" };
      const EDGE_TYPES = ["imports", "calls", "reads", "writes", "publishes", "subscribes", "registers"];
      const BOUNDARY_HUES = [210, 268, 328, 12, 28, 48, 196, 248, 302, 356, 38, 222, 278, 18, 145, 125, 90];
      const STATES = [
        ["selected", "selected"],
        ["callers", "callers"],
        ["dependencies", "callees"],

      const types = [...new Set(["module", ...sourceData.nodes.map(node => node.type)])].sort();
      const boundaries = [...new Set([...sourceData.nodes.map(node => node.boundary), ...groups.keys()])].sort((a, b) => a.localeCompare(b));
      const boundaryIndexes = new Map(boundaries.map((boundary, index) => [boundary, index]));
      const state = {

      const colRight = col => colLeft(col) + NODE_W;
      const rowTop = row => ORIGIN_Y + row * ROW_PITCH;
      const rowBottom = row => rowTop(row) + NODE_H;
      const laneY = (band, lane) => rowBottom(band) + LANE_GUTTER + LANE_STEP * lane;
      const laneX = (band, lane) => colRight(band) + LANE_GUTTER + LANE_STEP * lane;

      document.getElementById("generated-at").textContent = data.generated_at;
      document.getElementById("generated-commit").textContent = data.generated_from_commit.slice(0, 12);

      document.getElementById("codemap-title").textContent = `Code map of ${document.getElementById("repo-name").textContent}`;
      document.getElementById("codemap-desc").textContent =
        `${sourceData.nodes.length} modules in ${sourceData.edges.length} traces` + (data.flows.length ? `, ${data.flows.length} saved paths.` : ".");

      function htmlElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function svgElement(tag, attributes = {}) {
        const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
        return element;
      }

      const measureLayer = svgElement("g", { class: "node", "aria-hidden": "true", transform: "translate(-10000 -10000)" });
      const measureStamp = svgElement("text", { class: "boundary-stamp" });
      const measureTitle = svgElement("text", { class: "node-title" });
      const measurePath = svgElement("text", { class: "node-path" });
      measureLayer.append(measureStamp, measureTitle, measurePath);
      svg.append(measureLayer);
      function cardPlatePath(width = NODE_W, height = NODE_H) {
        const tl = CARD_RADIUS_TL;
        const tr = CARD_RADIUS_TR;
        const br = CARD_RADIUS_BR;
        const bl = CARD_RADIUS_BL;
        return [
          `M ${tl} 0`,
          `H ${width - tr}`,
          `A ${tr} ${tr} 0 0 1 ${width} ${tr}`,
          `V ${height - br}`,
          `A ${br} ${br} 0 0 1 ${width - br} ${height}`,
          `H ${bl}`,
          `A ${bl} ${bl} 0 0 1 0 ${height - bl}`,
          `V ${tl}`,
          `A ${tl} ${tl} 0 0 1 ${tl} 0`,
          "Z"
        ].join(" ");
      }

      const clipPath = document.getElementById("card-copy-clip-path");
      if (clipPath) clipPath.setAttribute("d", cardPlatePath());

      function fitText(value, probe, maxWidth) {
        probe.textContent = value;
        if (probe.getComputedTextLength() <= maxWidth) return value;
        let low = 0;
        let high = value.length;
        let best = "\u2026";
        while (low <= high) {
          const mid = Math.floor((low + high) / 2);
          const next = `${value.slice(0, Math.max(1, mid))}\u2026`;
          probe.textContent = next;
          if (probe.getComputedTextLength() <= maxWidth) {
            best = next;
            low = mid + 1;
          } else high = mid - 1;
        }
        return best;
      }

      function groupColor(boundary) {
        const index = boundaryIndexes.get(boundary) ?? 0;
        const hue = BOUNDARY_HUES[index % BOUNDARY_HUES.length];
        const root = getComputedStyle(document.documentElement);
        const sat = root.getPropertyValue("--boundary-saturation").trim() || "64%";
        const light = root.getPropertyValue("--boundary-lightness").trim() || "47%";
        return `hsl(${hue} ${sat} ${light})`;
      }

      function applyBoundaryStyle(element, boundary) {
        element.style.setProperty("--group-color", groupColor(boundary));
        element.dataset.boundary = boundary;
        element.dataset.boundaryIndex = String(boundaryIndexes.get(boundary) ?? 0);
        return element;
      }

      function projectView(animate = false) {
        stopViewAnimation();
        const query = state.query.trim().toLowerCase();
        let entries;
        if (state.selectedFlow !== null) {
          entries = [...new Set(sourceData.flows[state.selectedFlow].steps)].map(id => sourceNodes.get(id)).filter(Boolean);
        } else if (explorer.connection) {
          const ids = new Set([explorer.connection]);
          sourceData.edges.forEach(edge => { if (edge.from === explorer.connection || edge.to === explorer.connection) { ids.add(edge.from); ids.add(edge.to); } });
          entries = [...ids].map(id => sourceNodes.get(id));
        } else if (query || explorer.level === "all") {
          entries = sourceData.nodes.filter(node => `${node.id} ${node.label || ""} ${(node.symbols || []).join(" ")}`.toLowerCase().includes(query));
        } else {
          entries = groups.get(explorer.level).children.map(child => {
            if (child.kind === "node") return sourceNodes.get(child.id);
            const members = groupMembers(child.id);
            return { id: `group:${child.id}`, path: child.id, label: child.id.split("/").at(-1), type: "module", boundary: child.id,
              _group: child.id, _members: members, entrypoints: [], callers: [], callees: [], tests: [],
              evidence: { status: "inventory", locations: [] }, analysis: "group" };
          });
        }
        entries = entries.filter(node => node._group
          ? node._members.some(id => state.enabledTypes.has(sourceNodes.get(id).type) && (!explorer.changes || changedIds.has(id)))
          : state.enabledTypes.has(node.type) && (!explorer.changes || changedIds.has(node.id)));
        explorer.total = entries.length;
        explorer.page = Math.min(explorer.page, Math.max(0, Math.ceil(entries.length / 20) - 1));
        data.nodes = entries.slice(explorer.page * 20, (explorer.page + 1) * 20).map(node => ({ ...node, callers: [], callees: [] }));
        const membership = new Map();
        data.nodes.forEach(node => (node._members || [node.id]).forEach(id => membership.set(id, node.id)));
        const aggregate = new Map();
        sourceData.edges.forEach(edge => {
          const from = membership.get(edge.from), to = membership.get(edge.to);
          if (!from || !to || from === to) return;
          const key = `${from}\0${to}\0${edge.type}\0${Boolean(edge.type_only)}`;
          if (!aggregate.has(key)) aggregate.set(key, { ...edge, from, to, originals: [] });
          aggregate.get(key).originals.push(edge);
        });
        data.edges = [...aggregate.values()];
        const projected = new Map(data.nodes.map(node => [node.id, node]));
        data.edges.forEach(edge => { projected.get(edge.from).callees.push({ id: edge.to, type: edge.type }); projected.get(edge.to).callers.push({ id: edge.from, type: edge.type }); });
        if (state.selectedNode && !projected.has(state.selectedNode)) state.selectedNode = null;
        state.hoveredNode = null;
        state.overrides.clear();
        draw();
        renderNavigation();
        renderCardLegend();
        renderDetails();
        document.getElementById("empty-view").hidden = data.nodes.length > 0;
        document.getElementById("announcer").textContent = `${entries.length} modules in this view. Page ${explorer.page + 1}.`;
        fitMap({ overview: true, animate: animate && !keyboardInput() });
        if (animate && !reduceMotion.matches && !keyboardInput()) {
          viewport.querySelectorAll(".card-visual").forEach((card, index) => card.animate([
            { opacity: .2, transform: "translateY(10px)" }, { opacity: 1, transform: "translateY(0)" }
          ], { duration: MOTION.panel, delay: Math.min(index * 16, 100), easing: MOTION.ease }));
        }
      }

      function keyboardInput() { return document.documentElement.dataset.input === "keyboard"; }

      function navigate(level) {
        explorer.history.push({ level: explorer.level, page: explorer.page });
        explorer.level = level;
        explorer.changes = false;
        explorer.page = 0;
        explorer.connection = null;
        state.selectedNode = null;
        state.selectedFlow = null;
        state.query = "";
        document.getElementById("search").value = "";
        setPanel("right", true);
        projectView(true);
        renderFlows();
        if (keyboardInput()) viewport.querySelector(".node[data-node-id]")?.focus();
      }

      function renderNavigation() {
        const crumbs = document.getElementById("breadcrumbs");
        crumbs.replaceChildren();
        const add = (label, level) => {
          if (crumbs.childElementCount) crumbs.append(htmlElement("span", "", "/"));

        };
        add("Repository", ".");
        if (state.query) add("Search results", "all");
        else if (state.selectedFlow !== null) add("Call path", "all");
        else if (explorer.connection) add("Connections", "all");
        else if (explorer.level === "all") add("All modules", "all");
        else if (explorer.level !== ".") {

      function inspectChanges() {

        else {
          [["added_nodes", "Added modules"], ["removed_nodes", "Removed modules"], ["added_edges", "Added connections"], ["removed_edges", "Removed connections"], ["boundary_changes", "Boundary changes"], ["new_cycles", "New cycles"]].forEach(([field, label]) => {
            details.append(htmlElement("h3", "detail-section-label", `${label} · ${changes[field].length}`));
            changes[field].slice(0, 30).forEach(item => {
              const text = item.from ? `${item.from} → ${item.to} · ${item.type}` : item.nodes ? item.nodes.join(" → ") : item.before ? `${item.id}: ${item.before} → ${item.after}` : item.id;
              const block = htmlElement("div", "evidence-item");
              block.append(htmlElement("p", "detail-path", text));
              (item.evidence?.locations || []).forEach(location => block.append(evidenceBlock(location)));
              details.append(block);
            });
