name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run quality

  extension-host:
    name: Extension Host on ${{ matrix.os }} with ${{ matrix.vscode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: "1.134.0"
          - os: ubuntu-latest
            vscode: stable
          - os: ubuntu-latest
            vscode: insiders
          - os: windows-latest
            vscode: stable
          - os: macos-latest
            vscode: stable
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:integration
      - if: runner.os != 'Linux'
        run: pnpm run test:integration

  web-host:
    name: Web and writable virtual workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run package
      - run: pnpm run test:web

  vsix:
    name: VSIX package and clean-profile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run vsix
      - run: pnpm run inspect:vsix
      - run: xvfb-run -a pnpm run test:vsix
      - uses: actions/upload-artifact@v6
        with:
          name: code-annotations-vsix
          path: code-annotations.vsix
          if-no-files-found: error
